<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spor Günlüğüm">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232f5dff'/%3E%3Ctext x='90' y='118' font-size='92' text-anchor='middle'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232f5dff'/%3E%3Ctext x='90' y='118' font-size='92' text-anchor='middle'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<title>Spor Günlüğüm</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#65738a;--line:#dbe1ea;--acc:#2f5dff;--onacc:#fff;--ok:#16a36a;--okbg:#d5f3e5;--no:#c93a52;--nobg:#fde6ea;--water:#1c8fd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#1a2330;--ink:#e8edf5;--mut:#8d9bb0;--line:#2b3748;--acc:#6e8cff;--onacc:#0b1020;--ok:#38c48a;--okbg:#17382b;--no:#ef6b80;--nobg:#3a1c24;--water:#4db4f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161f;--card:#1a2330;--ink:#e8edf5;--mut:#8d9bb0;--line:#2b3748;--acc:#6e8cff;--onacc:#0b1020;--ok:#38c48a;--okbg:#17382b;--no:#ef6b80;--nobg:#3a1c24;--water:#4db4f0;color-scheme:dark}
:root[data-pal="siyah"]{--bg:#000;--card:#141414;--ink:#f2f2f2;--mut:#9b9b9b;--line:#2c2c2c;--acc:#f2f2f2;--onacc:#000;--ok:#38c48a;--okbg:#17382b;--no:#ef6b80;--nobg:#3a1c24;--water:#4db4f0;color-scheme:dark}
:root[data-pal="pembe"]{--bg:#e9b3ca;--card:#f8dbe6;--ink:#33101f;--mut:#6a3850;--line:#d094b0;--acc:#b8155a;--onacc:#fff;--ok:#0f8a58;--okbg:#c9ecdb;--no:#ab2139;--nobg:#f3bfca;--water:#2b78c2;color-scheme:light}
.pal{display:flex;gap:12px;justify-content:flex-end;margin:0 0 6px}
.pal button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.pal button.on{outline:3px solid var(--acc);outline-offset:2px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.mac b{display:block;font:700 24px/1 "Barlow Condensed",system-ui,sans-serif}
.mac span{font-size:13px;color:var(--mut)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 150px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0;font-weight:700;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:22px;margin:18px 0 8px}h3{font-size:20px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:10px;padding:10px 14px;font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.set{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.set b{color:var(--mut);text-align:center}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.ck{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:18px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meta{color:var(--mut);font-size:14px}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px;margin-right:6px}
.hint{color:var(--acc);font-size:13px;margin-top:6px}
.bar{height:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--water);transition:width .3s}
.bar.k i{background:var(--ok)}
.big{font:700 40px/1 "Barlow Condensed",system-ui,sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal span{text-align:center;color:var(--mut);font-size:13px}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:600;padding:0}
.cal .g{background:var(--ok);border-color:var(--ok);color:#fff}
.cal .m{background:var(--nobg);border-color:var(--nobg);color:var(--no)}
.cal .td{outline:2px solid var(--acc);outline-offset:1px}
.cal .f{color:var(--mut)}
.leg{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px;font-weight:600;border-radius:10px}
nav button.on{color:var(--acc);background:var(--bg)}
#rest{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;max-width:500px;margin:0 auto}
#rest .big{font-size:32px}
#rest .bar{flex:1;margin:0;background:rgba(127,127,127,.3);border:0}
#rest .bar i{background:var(--ok)}
#rest button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px}
.del{background:none;border:0;color:var(--no);font-size:14px;padding:4px}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
</style></head>
<body>
<main id="app"></main>
<div id="rest"><span class="big" id="rt">0:00</span><div class="bar"><i id="rb" style="width:0"></i></div><button onclick="stopRest()">Kapat</button></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=(n,s,r,t)=>({n,s,r,t});
const DEF={plan:[
{n:'İtiş (Push)',ex:[E('Push-up',4,'8-12',90),E('Pike Push-up',3,'6-10',90),E('Paralel Bar Dips',3,'8-12',90),E('Diamond Push-up',3,'8-12',60),E('Plank',3,'45 sn',45)]},
{n:'Çekiş (Pull)',ex:[E('Pull-up',4,'5-8',120),E('Australian Row',4,'8-12',90),E('Chin-up',3,'5-8',120),E('Scapular Pull-up',3,'8-10',60),E('Dead Hang',3,'30 sn',60)]},
{n:'Bacak & Core',ex:[E('Bodyweight Squat',4,'15-20',60),E('Bulgarian Split Squat',3,'10-12',90),E('Walking Lunge',3,'12',60),E('Glute Bridge',3,'15',60),E('Calf Raise',4,'20',45),E('Hollow Hold',3,'30 sn',45)]},
{n:'Skill & Core',ex:[E('Burpee',3,'10',60),E('Duvarda Handstand Hold',4,'20-30 sn',90),E('L-sit',3,'15 sn',60),E('Hanging Leg Raise',3,'10',75),E('Archer Push-up',3,'5-6',90)]}
],logs:{},water:{},food:{},cardio:{},kg:75,kcal:2200,sel:0,v:2};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('gym1')||'{}'))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('gym1',JSON.stringify(S))}catch(e){}};
S.custom=S.custom||[];
if(S.v!==2){S.plan=DEF.plan;S.sel=0;S.v=2;S.cardio=S.cardio||{};save()}
const key=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let tab='w',cm=0;
const PALS=[['mavi','#2f5dff'],['siyah','#111111'],['pembe','#b8155a']];
const applyPal=()=>{document.documentElement.dataset.pal=S.theme||'mavi'};
const palBar=()=>`<div class="pal">${PALS.map(q=>`<button class="${(S.theme||'mavi')===q[0]?'on':''}" style="background:${q[1]}" aria-label="${q[0]} tema" onclick="S.theme='${q[0]}';save();R()"></button>`).join('')}</div>`;
const TABS=[['w','Antrenman'],['c','Takvim'],['n','Beslenme'],['r','Tarifler']];
const log=()=>{const k=key();return S.logs[k]=S.logs[k]||{day:S.sel,sets:{}}};
const went=k=>!!(S.logs[k]&&S.logs[k].gym);
function last(name){const ks=Object.keys(S.logs).filter(k=>k<key()).sort().reverse();for(const k of ks){const a=(S.logs[k].sets||{})[name];const b=a&&a.filter(x=>x.ok);if(b&&b.length)return b.map(x=>x.kg+' kg × '+x.rep).join(', ')}return''}

function wk(){
  const p=S.plan[S.sel],L=S.logs[key()]||{sets:{}};
  let h=`<div class="row sp"><div><h1>Bugünün antrenmanı</h1><div class="sub">${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
  <div class="chips">${S.plan.map((d,i)=>`<button class="chip ${i==S.sel?'on':''}" onclick="S.sel=${i};save();R()">${esc(d.n)}</button>`).join('')}</div>
  <div class="card"><label class="lbl">Bu antrenmanın adı</label><input value="${esc(p.n)}" onchange="renameDay(this.value)"></div>
  <div class="card row sp"><span>${went(key())?'Bugün spora gittin ✓':'Bugün spora gittim'}</span><button class="btn sm ${went(key())?'alt':''}" onclick="togGym('${key()}')">${went(key())?'Geri al':'İşaretle'}</button></div>`;
  p.ex.forEach((e,ei)=>{
    const sets=(L.sets||{})[e.n]||[];const n=Math.max(e.s,sets.length);const lt=last(e.n);
    h+=`<div class="card"><div class="row sp"><h3>${esc(e.n)}</h3><button class="del" onclick="delEx(${ei})">${pend===S.sel+'-'+ei?'Silmek için tekrar dokun':'Sil'}</button></div>
    <div class="meta"><span class="pill">${e.s} set × ${esc(e.r)}</span><span class="pill">Dinlenme ${e.t} sn</span></div>
    ${lt?`<div class="hint">Geçen sefer: ${esc(lt)}</div>`:''}
    <div class="set meta"><span></span><span>Ek kilo (kg)</span><span>Tekrar / sn</span><span></span></div>`;
    for(let si=0;si<n;si++){const s=sets[si]||{};
      h+=`<div class="set"><b>${si+1}</b><input type="number" inputmode="decimal" placeholder="kg" value="${s.kg??''}" oninput="setv(${ei},${si},'kg',this.value)" onchange="setv(${ei},${si},'kg',this.value)"><input type="number" inputmode="numeric" placeholder="tekrar" value="${s.rep??''}" oninput="setv(${ei},${si},'rep',this.value)" onchange="setv(${ei},${si},'rep',this.value)"><button class="ck ${s.ok?'on':''}" aria-label="Seti tamamla" onclick="tick(${ei},${si})">✓</button></div>`}
    h+=`<div class="row" style="margin-top:10px"><button class="btn alt sm" onclick="addSet(${ei})">+ Set ekle</button></div></div>`});
  h+=cardioCard();
  h+=`<h2>Hareket ekle</h2><div class="card"><div class="grid2"><div><label class="lbl">Hareket adı</label><input id="xn"></div><div><label class="lbl">Set sayısı</label><input id="xs" type="number" value="3"></div><div><label class="lbl">Tekrar aralığı</label><input id="xr" value="8-12"></div><div><label class="lbl">Dinlenme (sn)</label><input id="xt" type="number" value="90"></div></div><button class="btn" style="margin-top:10px" onclick="addEx()">Ekle</button></div>
  <div class="sub" style="margin-top:8px">Dinlenme önerisi: zor hareketler (pull-up, dips, handstand) 90–120 sn, orta seviye hareketler 60–90 sn, bacak ve core 45–60 sn. Sadece vücut ağırlığıyla yapıyorsan ek kiloyu boş bırak.</div>`;
  return h}
const CT=['Koşu','Yürüyüş','Bisiklet','İp atlama','Yüzme','Diğer'];
const cd=k=>S.cardio[k]||[];
const cmin=k=>cd(k).reduce((a,b)=>a+b.m,0);
function weekMin(){let t=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);t+=cmin(key(d))}return t}
function cardioCard(){
  const t=cmin(key()),w=weekMin();
  return `<h2>Kardiyo</h2><div class="card"><div class="grid2"><div><span class="big">${t}</span> <span class="meta">dk bugün</span></div><div><span class="big">${w}</span> <span class="meta">dk son 7 gün</span></div></div>
  <div class="bar k"><i style="width:${Math.min(100,w/150*100)}%"></i></div><div class="meta">Haftalık hedef: 150 dk</div>
  <div class="grid2" style="grid-template-columns:2fr 1fr auto;align-items:end;margin-top:10px"><div><label class="lbl">Tür</label><select id="ct">${CT.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label class="lbl">Dakika</label><input id="cm" type="number" inputmode="numeric" placeholder="20"></div><button class="btn" onclick="addC()">Ekle</button></div>
  <div style="margin-top:10px">${cd(key()).map((x,i)=>`<div class="li"><span>${esc(x.t)} <span class="meta">${x.m} dk</span></span><button class="del" onclick="delC(${i})">Sil</button></div>`).join('')}</div></div>`}
function addC(){const m=+$('#cm').value;if(!m||m<1)return;const k=key();(S.cardio[k]=S.cardio[k]||[]).push({t:$('#ct').value,m:Math.round(m)});save();R()}
function delC(i){S.cardio[key()].splice(i,1);save();R()}
const ACT=[[1.2,'Hareketsiz (masa başı, spor yok)'],[1.375,'Hafif aktif (haftada 1-3 gün spor)'],[1.55,'Orta aktif (haftada 3-5 gün spor)'],[1.725,'Çok aktif (haftada 6-7 gün spor)'],[1.9,'Aşırı aktif (günde 2 antrenman veya ağır iş)']];
const GOALS=[['gv','Kilo ver (−500 kcal)',-500],['gy','Yavaş kilo ver (−300 kcal)',-300],['kr','Kilomu koru',0],['al','Kas yap / kilo al (+300 kcal)',300]];
function calcRes(){
  const P=S.prof||{},kg=S.kg,h=+P.h,a=+P.age;
  if(!P.sex||!(h>=120)||!(a>=14)||!(kg>=30)||!P.act||!P.goal)return null;
  const bmr=10*kg+6.25*h-5*a+(P.sex==='e'?5:-161),tdee=bmr*(+P.act),adj=GOALS.find(g=>g[0]===P.goal)[2];
  const floor=Math.max(bmr,P.sex==='e'?1500:1200);let t=tdee+adj,low=false;
  if(t<floor){t=floor;low=true}
  t=Math.round(t/10)*10;
  const pr=Math.round(kg*(adj<0?2:1.8)),fat=Math.round(t*.25/9),carb=Math.max(0,Math.round((t-pr*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),t,low,pr,fat,carb}}
function setP(k,v){S.prof=S.prof||{};S.prof[k]=v;save();R()}
function useT(){const r=calcRes();if(r){S.kcal=r.t;S.pg=r.pr;save();R()}}
function calcCard(){
  const P=S.prof||{},r=calcRes();
  const sel=(k,o)=>`<select onchange="setP('${k}',this.value)"><option value="">Seç</option>${o.map(x=>`<option value="${x[0]}" ${String(P[k])===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  return `<h2>Kalori hedefimi hesapla</h2><div class="card"><div class="grid2">
  <div><label class="lbl">Cinsiyet</label>${sel('sex',[['e','Erkek'],['k','Kadın']])}</div>
  <div><label class="lbl">Yaş</label><input type="number" inputmode="numeric" value="${P.age||''}" onchange="setP('age',this.value)"></div>
  <div><label class="lbl">Boy (cm)</label><input type="number" inputmode="numeric" value="${P.h||''}" onchange="setP('h',this.value)"></div>
  <div><label class="lbl">Kilo</label><div class="meta" style="padding:10px 0">${S.kg} kg (yukarıdaki kutudan)</div></div></div>
  <div style="margin-top:8px"><label class="lbl">Günlük hareket düzeyin</label>${sel('act',ACT)}</div>
  <div style="margin-top:8px"><label class="lbl">Hedefin</label>${sel('goal',GOALS)}</div>
  ${r?`<div class="grid2" style="margin-top:12px"><div><span class="big">${r.bmr}</span><div class="meta">bazal metabolizma (kcal)</div></div><div><span class="big">${r.tdee}</span><div class="meta">günlük harcaman (kcal)</div></div></div>
  <div class="card" style="background:var(--bg)"><div class="meta">Önerilen günlük hedef</div><span class="big">${r.t} kcal</span>
  <div class="meta" style="margin-top:6px">Protein ~${r.pr} g · Yağ ~${r.fat} g · Karbonhidrat ~${r.carb} g</div>
  ${r.low?'<div class="meta" style="margin-top:6px;color:var(--no)">Hedef güvenli alt sınıra çekildi, bunun altına inmeni önermem.</div>':''}
  <button class="btn" style="margin-top:10px" onclick="useT()" ${S.kcal===r.t?'disabled':''}>${S.kcal===r.t?'Hedefin bu değerde ✓':'Bunu hedefim yap'}</button></div>
  <div class="meta">Mifflin-St Jeor formülü ve hareket katsayısı kullanılır. Bu bir tahmindir. 2-3 hafta sonra kilonun değişimine bakıp 100-200 kcal ayarlayabilirsin.</div>`:'<div class="meta" style="margin-top:10px">Tüm alanları doldurunca hedefin burada görünür.</div>'}</div>`}
let rmeal='x',rall=false;
const RM=[['x','Hepsi'],['h','Kahvaltı'],['a','Ana öğün'],['r','Ara öğün']];
/* Ad;öğün;dk;kcal;protein;karb;yağ;malzemeler;yapılış */
const RC=`Yulaf lapası;h;8;380;13;61;10;40 g yulaf, 200 ml süt, 1 muz, tarçın;Yulafı sütle 4-5 dakika kaynat, üzerine dilimlenmiş muz ve tarçın ekle.
Menemen;h;10;220;13;7;15;2 yumurta, 1 domates, 1 biber, 1 tatlı kaşığı zeytinyağı;Biberi yağda kavur, domatesi ekleyip suyunu çektir, yumurtaları kırıp karıştır.
Proteinli yulaf;h;6;270;29;26;5;40 g yulaf, 1 ölçek protein tozu, 150 ml su;Yulafı suyla pişir, hafif ılınınca protein tozunu ekleyip karıştır.
Peynirli omlet;h;7;225;18;1;16;2 yumurta, 30 g beyaz peynir, maydanoz;Yumurtaları çırpıp peynir ve maydanozla yapışmaz tavada pişir.
Süzme yoğurt kasesi;h;3;335;18;33;15;150 g süzme yoğurt, 20 g yulaf, yarım muz, 10 g ceviz;Yoğurdun üzerine yulaf, dilimlenmiş muz ve ceviz ekle.
Tavuklu bulgur pilavı;a;25;440;43;38;13;120 g tavuk göğsü, 150 g bulgur pilavı, bir kase çoban salata;Tavuğu ızgarada veya tavada pişir, pilav ve salatayla servis et.
Tavuklu salata;a;15;355;39;7;19;120 g tavuk göğsü, marul, domates, salatalık, 1 yemek kaşığı zeytinyağı, limon;Tavuğu pişirip dilimle, doğranmış sebzelerin üzerine yağ ve limonla ekle.

    q=q.replace(/\b(adet|tane|dilim|kase|bardak|olcek|porsiyon|avuc|yemek|tatli|kasigi|kutu|fincan|top|parca|kare|kadeh|sise|kup|tabak|bir)\b/g,' ').trim();
    let b=null,bs=0;
    db.forEach(f=>f.al.forEach(a=>{const sc=q.includes(a)?a.length:(q.length>=3&&a.includes(q)?q.length-.5:0);if(sc>bs){bs=sc;b=f}}));
    if(!b){miss.push(part);return}
    const mu=b.p?qty:gram?qty/100:b.g/100*qty,r1=v=>Math.round(v*mu*10)/10;
    out.push({n:(gram&&!b.p?fmt(qty)+' g ':fmt(qty)+' '+b.u+' ')+b.n,k:Math.round(b.k*mu),pr:r1(b.P),ch:r1(b.C),fa:r1(b.F),ai:b.c?0:1});
  });
  return{out,miss}}
let fmsg='';
function addF(){
  const n=$('#fn').value.trim(),k=+$('#fk').value,d=key();if(!n)return;
  const put=x=>{(S.food[d]=S.food[d]||[]).push(x)};
  fmsg='';
  if(k){put({n,k:Math.round(k)});save();R();return}
  const r=parseFood(n);
  if(!r.out.length){$('#ai').textContent='Listede bulunamadı. Kcal değerini elle yaz veya aşağıdan kendi besinini ekle.';return}
  r.out.forEach(put);
  if(r.miss.length)fmsg='Bulunamayanlar: '+r.miss.join(', ')+'. Bunlar için kcal değerini elle yaz veya kendi besinini ekle.';
  save();R()}
function customCard(){
  return `<h2>Kendi besinlerim</h2><div class="card"><div class="meta" style="margin-bottom:8px">Besini bir kez kaydet, sonra Ne yedin? kutusuna adını yazman yeterli. Örn. 2 ölçek protein tozu. Listedeki bir besinle aynı adı kaydedersen senin değerin kullanılır.</div>
  <div><label class="lbl">Besin adı</label><input id="cn" placeholder="Örn. Whey protein"></div>
  <div class="grid2" style="margin-top:8px"><div><label class="lbl">Kcal</label><input id="ck" type="number" inputmode="decimal"></div><div><label class="lbl">Kalori neye ait?</label><select id="cb"><option value="p">1 ölçek / adet / porsiyon</option><option value="g">100 g veya ml</option></select></div></div>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-top:8px"><div><label class="lbl">Protein (g)</label><input id="cpr" type="number" inputmode="decimal"></div><div><label class="lbl">Karb. (g)</label><input id="cch" type="number" inputmode="decimal"></div><div><label class="lbl">Yağ (g)</label><input id="cfa" type="number" inputmode="decimal"></div></div><div class="meta" style="margin-top:4px">Makroları kalori ile aynı birime göre yaz. Boş bırakabilirsin.</div>
  <button class="btn" style="margin-top:10px" onclick="addCF()">Kaydet</button>
  <div style="margin-top:10px">${S.custom.map((x,i)=>`<div class="li"><span>${esc(x.n)} <span class="meta">${x.k} kcal / ${x.b==='g'?'100 g':'porsiyon'} · P ${x.pr||0} K ${x.ch||0} Y ${x.fa||0}</span></span><button class="del" onclick="delCF(${i})">Sil</button></div>`).join('')}</div></div>`}
function addCF(){const n=$('#cn').value.trim(),v=$('#ck').value,k=+v;if(!n||v===''||!(k>=0))return;S.custom=S.custom.filter(x=>nz(x.n)!==nz(n));S.custom.push({n,k,b:$('#cb').value,pr:+$('#cpr').value||0,ch:+$('#cch').value||0,fa:+$('#cfa').value||0});save();R()}
function delCF(i){S.custom.splice(i,1);save();R()}
function delF(i){S.food[key()].splice(i,1);save();R()}

let T={end:0,tot:0},iv=null;
function startRest(s){T={end:Date.now()+s*1000,tot:s*1000};$('#rest').style.display='flex';clearInterval(iv);iv=setInterval(tickT,250);tickT()}
function stopRest(){clearInterval(iv);$('#rest').style.display='none'}
function tickT(){const r=T.end-Date.now();if(r<=0){try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}stopRest();return}
  const s=Math.ceil(r/1000);$('#rt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('#rb').style.width=(100-r/T.tot*100)+'%'}

function R(){
  applyPal();$('#app').innerHTML=palBar()+(tab==='w'?wk():tab==='c'?cal():tab==='r'?rec():nut());
  $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';R();scrollTo(0,0)">${t[1]}</button>`).join('')}
function exportData(){
  save();
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='spor-gunlugum-yedek-'+key()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  const el=$('#bmsg');if(el)el.textContent='Yedek dosyası indirildi ✓';
}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!d.plan)throw new Error('Geçersiz dosya');
      S=Object.assign({},DEF,d);
      S.custom=S.custom||[];
      S.cardio=S.cardio||{};
      save();R();
      const el=$('#bmsg');if(el)el.textContent='Yedek başarıyla geri yüklendi ✓';
    }catch(e){
      const el=$('#bmsg');if(el)el.textContent='Hata: Geçerli bir yedek dosyası seçin.';
    }
  };
  r.readAsText(f);
}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
R();
